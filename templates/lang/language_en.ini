[LOGIN]
INTRO = "One-time Bold login to obtain the tokens (same OAuth flow the Bold app uses). Afterwards the plugin refreshes the access token automatically – no need to repeat this."
STEP1 = "1. Sign in at Bold"
OPEN_BTN = "Open Bold login"
STEP1_HELP = "Opens Bold's login page in a new tab. Sign in there. Best done on a desktop browser that does NOT have the Bold app installed. After signing in, the browser tries to open a link starting with boldsmartlock://auth?code=… and shows an error – that is expected."
STEP2 = "2. Paste the code"
STEP2_HELP = "Copy the whole boldsmartlock://auth?code=… URL from the address bar (or just the code=… part) and paste it below. The code is single-use and short-lived, so do this right after signing in."
CODE = "Authorization code / redirect URL"
EXCHANGE_BTN = "Finish login & save tokens"
SUCCESS = "Success! Tokens stored. Next: open Settings, run Discover and pick your lock."
GOTO_SETTINGS = "Go to Settings"

[ABOUT]
TEXT = "bold2lox bridges a Loxone Miniserver (incl. Gen 1) to a Bold Smart Lock through the official Bold cloud API. Remote activation requires a Bold Connect (the socket bridge)."
