[LOGIN]
INTRO = "One-time sign-in to connect your Bold account (the same OAuth flow the Bold app uses). Afterwards the plugin refreshes access automatically – you only need to repeat this if you change your Bold password."
STEP1 = "Step 1 · Sign in at Bold"
OPEN_BTN = "Open Bold login ↗"
STEP1_HELP = "Opens Bold's sign-in page in a new tab – best in a desktop browser that does NOT have the Bold app installed. Sign in with your password or Apple/Google/Microsoft. When you're done, the browser tries to open a link starting with boldsmartlock://auth?code=… and shows a 'cannot open page' error. That is exactly what should happen."
STEP2 = "Step 2 · Paste the result here"
STEP2_HELP = "Copy the whole boldsmartlock://auth?code=… address from the browser's address bar (or just the code=… part) and paste it below. The code is single-use and expires quickly, so paste it right after signing in."
CODE = "Redirect URL or code"
CODE_PLACEHOLDER = "boldsmartlock://auth?code=…"
EXCHANGE_BTN = "Connect account"
INVALID = "That doesn't look like a Bold code. Paste the whole boldsmartlock://auth?code=… address."
SUCCESS = "Connected! Your Bold account is linked. Next: open Settings, run Discover and pick your lock."
GOTO_SETTINGS = "Go to Settings →"
TIP_TITLE = "Can't grab the code from the address bar?"
TIP_BODY = "Open the browser's developer tools (F12) → Network tab → enable 'Preserve log' before you sign in. After signing in, find the request that redirects to boldsmartlock://auth?code=… – the code is in that URL."

[ABOUT]
TEXT = "bold2lox bridges a Loxone Miniserver (incl. Gen 1) to a Bold Smart Lock through the official Bold cloud API. Remote activation requires a Bold Connect (the socket bridge)."
